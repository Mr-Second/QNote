# Release — build the portable zip (GitHub channel) and publish it.
#
# Triggered by pushing a version tag (v1.2.0 → app version 1.2.0.0) or
# manually via workflow_dispatch (uses the version currently in the repo;
# `dry-run` validates the WHOLE pipeline — artifact download, SHA256SUMS,
# notes prep — and skips only the final `gh release create` step).
#
# Channel split (portable-github-channel task, v1.2.0+):
#   Store  = installed MSIX, Microsoft-trusted signature, auto-update.
#   GitHub = portable, UNSIGNED zip; integrity via SHA256 checksums only.
#   The former SignPath / self-signed-PFX / install.ps1 flow is gone — this
#   file intentionally references no secrets at all.
#
# Flow (the variant is its own job via the matrix — wtq lesson):
#   resolve-version → [portable native-aot]
#     → patch manifest + csproj versions (working copy only, never committed)
#     → dotnet publish → zip (publish output + LICENSE + third-party notices,
#        no *.pdb / vendor *.xml) → .sha256 sidecar → smoke test → artifact
#   → release: SHA256SUMS.txt + prepared zh notes (auto-generated changelog
#     is appended below them by --generate-notes) + gh release create.
#
# The self-contained variant was switched to NativeAOT (2026-10-01 AOT
# experiment, verdict GO): zip 33MB vs 88.4MB, warm-start OnLaunched -60%,
# zero runtime deps — strictly better than the old SC build. The old
# win-x64-portable-selfcontained.pubxml stays in the repo as the fallback
# if a runner/toolchain change ever breaks the AOT path. The AOT exe keeps
# VERSIONINFO (update-check reads FileVersion — verified 2026-10-01); the
# 88.6MB native QNote.pdb is excluded by the existing /XF *.pdb filter.
#
# Smoke-test caveat: this workflow installs the .NET SDK itself
# (actions/setup-dotnet), so the runner is NOT a clean machine. The native-aot
# zip is zero-dependency and should boot anywhere, but genuine clean-machine
# acceptance is still done manually by the user for each release.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Validate the whole pipeline but skip the final publish step'
        type: boolean
        default: false

permissions:
  contents: write # gh release create

# Queue (not cancel) overlapping runs for the same ref: a dry-run dispatched
# while a tag push is in flight must not race the real release for
# gh release create.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Single source of truth for the version math; the portable job and the
  # release job both consume the output instead of recomputing it.
  resolve-version:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Tag push: v1.2.0 → 1.2.0.0 (padded to 4 parts). workflow_dispatch:
      # keep the repo version (csproj <Version>, kept in sync with the
      # appxmanifest by the version-single-source convention).
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $parts = ($env:GITHUB_REF_NAME -replace '^v', '').Split('.')
            while ($parts.Count -lt 4) { $parts += '0' }
            $version = ($parts | Select-Object -First 4) -join '.'
          } else {
            $csproj = [xml](Get-Content 'src/QNote/QNote.csproj' -Raw)
            $version = ($csproj.Project.PropertyGroup | Where-Object { $_.Version }).Version
          }
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "Invalid version: '$version'" }
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Output "Version: $version"

  portable:
    needs: resolve-version
    name: portable (${{ matrix.variant }})
    runs-on: windows-latest
    # The AOT leg (ILCompiler + native link) is the longest job in the file;
    # fail fast on a hung toolchain instead of burning the 6 h default.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: native-aot
            profile: win-x64-portable-aot
            publish-dir: publish-portable-aot
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: NuGet cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Tag push: patch the resolved version into the manifest AND the csproj
      # <Version>/<FileVersion> (the exe VERSIONINFO drives the portable
      # update check). Working copy only — never committed. Same convention
      # as the old manifest patch; workflow_dispatch is a no-op rewrite.
      - name: Patch versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.resolve-version.outputs.version }}'

          $manifestPath = 'src/QNote/Package.appxmanifest'
          [xml]$manifest = Get-Content $manifestPath
          $manifest.Package.Identity.Version = $version
          $manifest.Save((Resolve-Path $manifestPath).Path)
          [xml]$manifestCheck = Get-Content $manifestPath
          if ($manifestCheck.Package.Identity.Version -ne $version) { throw 'manifest patch failed' }

          # Text replace (not DOM) so the csproj's documentation comments and
          # formatting survive byte-for-byte.
          $csprojPath = 'src/QNote/QNote.csproj'
          $csproj = Get-Content $csprojPath -Raw
          $csproj = $csproj -replace '<Version>[^<]*</Version>', "<Version>$version</Version>"
          $csproj = $csproj -replace '<FileVersion>[^<]*</FileVersion>', "<FileVersion>$version</FileVersion>"
          Set-Content -Path $csprojPath -Value $csproj -NoNewline -Encoding utf8
          if ((Select-String -Path $csprojPath -Pattern "<Version>$version</Version>" -SimpleMatch).Count -lt 1) { throw 'csproj patch failed' }
          Write-Output "Patched manifest + csproj to $version"

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/QNote/QNote.csproj -c Release -p:Platform=x64 `
            -p:PublishProfile=${{ matrix.profile }}.pubxml --nologo
          if ($LASTEXITCODE -ne 0) { throw "publish failed ($LASTEXITCODE)" }

      # Zip layout (research portable-builds.md §3): publish output at the
      # zip root + LICENSE + docs/third-party-notices.md. *.pdb and vendor
      # *.xml are excluded from the staging copy (quick win ②) — the notices
      # file is staged explicitly and never meets the filter.
      - name: Stage and zip
        id: zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.resolve-version.outputs.version }}'
          $publishDir = 'src/QNote/bin/Release/net10.0-windows10.0.26100.0/win-x64/${{ matrix.publish-dir }}'
          if (-not (Test-Path (Join-Path $publishDir 'QNote.exe'))) { throw "QNote.exe not found in $publishDir" }

          $stage = Join-Path $env:RUNNER_TEMP "stage-${{ matrix.variant }}"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          robocopy $publishDir $stage /E /XF *.pdb *.xml /NFL /NDL /NJH /NJS | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed ($LASTEXITCODE)" }
          # AOT payload guard: QNote.runtimeconfig.json is a CoreCLR-only
          # file (the native exe never reads it); its presence here means the
          # csproj TrimRuntimeConfigFromAotPublish filter stopped firing
          # (e.g. an SDK change broke the publish-items hook).
          if (Test-Path (Join-Path $stage 'QNote.runtimeconfig.json')) { throw 'QNote.runtimeconfig.json leaked into the AOT publish output' }
          Copy-Item LICENSE "$stage/LICENSE"
          Copy-Item docs/third-party-notices.md "$stage/third-party-notices.md"

          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $zip = "dist/QNote_${version}_win-x64_${{ matrix.variant }}.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $mb = [Math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Output "Zip: $zip ($mb MB)"
          "zip=$zip" | Out-File $env:GITHUB_OUTPUT -Append

          # GH Actions' pwsh wrapper propagates the LASTEXITCODE of the last
          # NATIVE command when the script ends without an explicit exit —
          # robocopy returns 1 on success-with-copies, which failed this step
          # on v1.2.0's first run (zip was fine, step still went red). All
          # failure paths above throw; an explicit exit 0 cannot mask errors.
          exit 0

      - name: SHA256 sidecar
        shell: pwsh
        run: |
          $zip = '${{ steps.zip.outputs.zip }}'
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $zip -Leaf)" | Out-File "$zip.sha256" -Encoding utf8
          Get-Content "$zip.sha256"

      # wtq lesson: launch the ACTUAL release zip and assert the process
      # stays alive. The app may hide to tray on WorkingSetTrim — that is
      # fine, process-alive is the oracle.
      - name: Smoke test (unzip → launch → alive → kill)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = '${{ steps.zip.outputs.zip }}'
          $smoke = Join-Path $env:RUNNER_TEMP "smoke-${{ matrix.variant }}"
          if (Test-Path $smoke) { Remove-Item $smoke -Recurse -Force }
          Expand-Archive $zip -DestinationPath $smoke
          $exe = Join-Path $smoke 'QNote.exe'
          if (-not (Test-Path $exe)) { throw 'QNote.exe not found in the zip' }

          function Assert-Alive([string]$Label) {
            $p = Start-Process -FilePath $exe -WorkingDirectory $smoke -PassThru
            Start-Sleep -Seconds 20
            $p.Refresh()
            if ($p.HasExited) { throw "$Label`: QNote.exe exited early (code $($p.ExitCode))" }
            $p.Kill($true)
            if (-not $p.WaitForExit(10000)) { throw "$Label`: process did not exit after kill" }
            Write-Output "$Label`: alive after 20 s — PASS"
          }

          # 1. Happy path: portable data root is taken (exe-adjacent data\
          #    created — proves the full pipeline booted: WinAppSDK bootstrap,
          #    WinUI, SQLite store, logging).
          Assert-Alive 'Happy path'
          if (-not (Test-Path (Join-Path $smoke 'data'))) { throw 'Portable data\ was not created next to the exe' }
          Write-Output 'Portable data root: PASS'

          # 2. Fallback path (research §5.4 data-as-file trick: probe failure
          #    must fall back to %APPDATA%, not crash).
          Remove-Item (Join-Path $smoke 'data') -Recurse -Force
          New-Item -ItemType File -Path (Join-Path $smoke 'data') | Out-Null
          Assert-Alive 'Read-only fallback'
          if ((Get-Item (Join-Path $smoke 'data')).PSIsContainer) { throw 'data became a directory — probe did not fail' }
          if (-not (Test-Path (Join-Path $env:APPDATA 'QNote/QNote'))) { throw 'Roaming fallback root was not created' }
          Write-Output 'Roaming fallback root: PASS'

          Remove-Item $smoke -Recurse -Force
          Remove-Item (Join-Path $env:APPDATA 'QNote') -Recurse -Force -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: portable-${{ matrix.variant }}
          path: |
            ${{ steps.zip.outputs.zip }}
            ${{ steps.zip.outputs.zip }}.sha256
          if-no-files-found: error

  release:
    needs: [resolve-version, portable]
    runs-on: windows-latest
    timeout-minutes: 15
    # The job ALWAYS runs (a dry-run validates the artifact download,
    # SHA256SUMS assembly and notes prep too); only the final publish
    # step below is gated per event. Tag push → publish. Dispatch →
    # publish unless dry-run was checked. Any future trigger (e.g. a
    # schedule) would NOT match the event allowlist → never publishes.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Downloads the portable artifact into dist/<artifact-name>/.
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: SHA256SUMS.txt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Concatenate the per-zip sidecars (already computed in the variant
          # job; artifact transport preserves bytes) into one checksum file.
          # @() keeps the guard correct when only one sidecar exists
          # (ForEach-Object output collapses to a scalar string, and $null
          # if the artifact download failed — .Count would lie in both).
          $sums = @(Get-ChildItem dist -Recurse -Filter '*.sha256' | Sort-Object Name |
            ForEach-Object { (Get-Content $_.FullName -Raw).TrimEnd("`r", "`n") })
          if ($sums.Count -ne 1) { throw "expected 1 sidecar, got $($sums.Count)" }
          $sums | Set-Content dist/SHA256SUMS.txt -Encoding utf8
          Get-Content dist/SHA256SUMS.txt

      - name: Prepare release notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.resolve-version.outputs.version }}'
          $notes = (Get-Content '.github/release-notes-template.md' -Raw).Replace('{VERSION}', $version)
          Set-Content -Path "$env:RUNNER_TEMP/notes.md" -Value $notes -NoNewline -Encoding utf8
          Write-Output "Release notes prepared ($($notes.Length) chars)"

      # On tag pushes the tag already exists; on workflow_dispatch gh creates
      # it from the triggering commit. gh appends the Release-Notes-API
      # changelog BELOW the --notes-file body (verified against the gh
      # manual), so the prepared zh notes stay on top.
      - name: Create GitHub Release
        # Publish gate (event-explicit, fail-closed): only tag pushes and
        # non-dry-run dispatches reach gh release create. The old job-level
        # `inputs.dry-run != true` was fail-open — any future trigger kind
        # (schedule, etc.) would have published.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry-run != true) }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ needs.resolve-version.outputs.version }}'
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$version" }
          $assets = @('dist/SHA256SUMS.txt')
          $assets += Get-ChildItem dist -Recurse -Include *.zip, *.sha256 | Sort-Object Name |
            ForEach-Object { $_.FullName }
          Write-Output "Assets:"; $assets | ForEach-Object { Write-Output "  $_" }
          gh release create $tag --target $env:GITHUB_SHA --title "QNote $version" `
            --notes-file "$env:RUNNER_TEMP/notes.md" --generate-notes @assets
