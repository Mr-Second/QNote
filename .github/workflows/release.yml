# Release — build, sign, and publish the MSIX package.
#
# Triggered by pushing a version tag (v1.0.2 → package version 1.0.2.0) or
# manually via workflow_dispatch (uses the version currently in the manifest).
#
# ┌─ Required configuration ─────────────────────────────────────────────────┐
# │ Self-signed mode (works today):                                          │
# │   secret  QNOTE_PFX_BASE64       base64 of certs/qnote.pfx (CN=QNote)    │
# │   secret  QNOTE_PFX_PASSWORD     PFX password                            │
# │                                                                          │
# │ SignPath mode (once the OSS application is approved — takes precedence   │
# │ whenever SIGNPATH_ORGANIZATION_ID is set):                               │
# │   secret  SIGNPATH_API_TOKEN     SignPath user API token                 │
# │   var     SIGNPATH_ORGANIZATION_ID  SignPath org UUID                    │
# │   var     SIGNPATH_PUBLISHER     exact cert subject of the SignPath      │
# │                                  project, e.g. "CN=SignPath Foundation,  │
# │                                  O=SignPath Foundation, L=Lewes,         │
# │                                  S=Delaware, C=US" — verify in the       │
# │                                  SignPath UI before setting!             │
# │   var     SIGNPATH_PROJECT_SLUG  optional, defaults to "qnote"           │
# │   var     SIGNPATH_POLICY_SLUG   optional, defaults to "release-signing" │
# └──────────────────────────────────────────────────────────────────────────┘
#
# IMPORTANT — MSIX identity:
#   The manifest Publisher must EXACTLY match the signing certificate subject,
#   or the package will not install. Publisher is part of the package family
#   identity: switching CN=QNote → the SignPath subject forces a one-time
#   uninstall/reinstall for existing installs. After the SignPath switch the
#   Publisher string must NEVER change again.
#
# IMPORTANT — SignPath manual approval:
#   Every release-signing request must be approved by a human in the SignPath
#   web UI. The signing step blocks with a 3600s timeout for that reason —
#   approve the request (email notification) before it expires.
#
# Packaging notes (spec §Packaging):
#   The MSIX must be produced by VS full-framework MSBuild (/t:Publish) —
#   `dotnet publish` fails MSB4018 on the WinAppSdk manifest validation task.
#   The package is built UNSIGNED here and signed afterwards (either mode).

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # gh release create

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild (VS full-framework — required for MSIX packaging)
        uses: microsoft/setup-msbuild@v3

      - name: NuGet cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Tag push: v1.0.2 → 1.0.2.0 patched into the manifest (working copy
      # only, never committed). workflow_dispatch: keep the manifest version.
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $manifestPath = 'src/QNote/Package.appxmanifest'
          [xml]$manifest = Get-Content $manifestPath
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $parts = ($env:GITHUB_REF_NAME -replace '^v', '').Split('.')
            while ($parts.Count -lt 4) { $parts += '0' }
            $version = $parts[0..3] -join '.'
            $manifest.Package.Identity.Version = $version
            $manifest.Save((Join-Path $PWD $manifestPath))
          } else {
            $version = $manifest.Package.Identity.Version
          }
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Output "Package version: $version"

      # SignPath mode only: patch the manifest Publisher to the SignPath cert
      # subject. Must happen BEFORE packaging. See the header comments — this
      # string must never change once set.
      - name: Patch manifest Publisher (SignPath mode)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          $manifestPath = 'src/QNote/Package.appxmanifest'
          [xml]$manifest = Get-Content $manifestPath
          $manifest.Package.Identity.Publisher = '${{ vars.SIGNPATH_PUBLISHER }}'
          $manifest.Save((Join-Path $PWD $manifestPath))
          Write-Output "Publisher set to: $($manifest.Package.Identity.Publisher)"

      - name: Build unsigned MSIX
        shell: pwsh
        run: |
          msbuild src/QNote/QNote.csproj /restore /t:Publish /p:Configuration=Release `
            /p:Platform=x64 /p:PublishProfile=win-x64.pubxml `
            /p:PublishAppxPackage=true /p:AppxPackageSigningEnabled=false /nologo
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed ($LASTEXITCODE)" }

      - name: Locate unsigned MSIX
        id: locate
        shell: pwsh
        run: |
          $msix = Get-ChildItem 'src/QNote/AppPackages' -Recurse -Filter '*.msix' |
                  Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msix) { throw "No .msix found under src/QNote/AppPackages" }
          "msix=$($msix.FullName)" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Output "Unsigned MSIX: $($msix.FullName)"

      # ── SignPath signing ──────────────────────────────────────────────────
      # upload-artifact always wraps files in a ZIP; the SignPath artifact
      # configuration therefore expects <zip-file><msix-file path="QNote.msix">.
      # Stage the package under the fixed name QNote.msix so the artifact
      # configuration matches regardless of version numbers.

      - name: Stage MSIX for SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path signpath-in | Out-Null
          Copy-Item '${{ steps.locate.outputs.msix }}' 'signpath-in/QNote.msix'

      - name: Upload unsigned artifact
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-msix
          path: signpath-in/QNote.msix

      # NOTE: release-signing waits for manual approval in the SignPath UI —
      # the 3600s timeout is deliberate. Approve the request when notified.
      - name: Submit SignPath signing request
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'qnote' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          output-artifact-directory: signpath-out
          wait-for-completion-timeout-in-seconds: '3600'
          parameters: |
            productName: QNote

      # The signed artifact mirrors the submitted structure: a ZIP containing
      # the signed QNote.msix.
      - name: Extract signed MSIX (SignPath)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          $zip = Get-ChildItem 'signpath-out' -Recurse -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw "No signed artifact ZIP found in signpath-out" }
          Expand-Archive $zip.FullName -DestinationPath 'signpath-out/extracted' -Force
          $signed = Get-ChildItem 'signpath-out/extracted' -Recurse -Filter 'QNote.msix' | Select-Object -First 1
          if (-not $signed) { throw "No QNote.msix inside the signed artifact" }
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item $signed.FullName "dist/QNote_${{ steps.version.outputs.version }}_x64.msix"

      # ── Self-signed fallback (pre-SignPath) ───────────────────────────────

      - name: Sign MSIX (self-signed fallback)
        if: vars.SIGNPATH_ORGANIZATION_ID == ''
        shell: pwsh
        env:
          QNOTE_PFX_BASE64: ${{ secrets.QNOTE_PFX_BASE64 }}
          QNOTE_PFX_PASSWORD: ${{ secrets.QNOTE_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfxPath = Join-Path $env:RUNNER_TEMP 'qnote.pfx'
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:QNOTE_PFX_BASE64))
            $signtool = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin/*/x64/signtool.exe' |
                        Sort-Object { [version]($_.FullName -replace '.*\\bin\\(\d+\.\d+\.\d+\.\d+)\\.*', '$1') } -Descending |
                        Select-Object -First 1 -ExpandProperty FullName
            if (-not $signtool) { throw "signtool.exe not found" }
            & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
              /f $pfxPath /p $env:QNOTE_PFX_PASSWORD '${{ steps.locate.outputs.msix }}'
            if ($LASTEXITCODE -ne 0) { throw "signtool failed ($LASTEXITCODE)" }

            # Export the public cert for the release assets (users must trust
            # it once — see docs/msix-install.md).
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(
              $pfxPath, $env:QNOTE_PFX_PASSWORD)
            New-Item -ItemType Directory -Path dist | Out-Null
            [IO.File]::WriteAllBytes("$PWD/dist/qnote.cer",
              $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))

            Copy-Item '${{ steps.locate.outputs.msix }}' "dist/QNote_${{ steps.version.outputs.version }}_x64.msix"

            # One-download bundle for end users: install.ps1 + qnote.cer + msix.
            $stage = Join-Path $env:RUNNER_TEMP 'bundle'
            New-Item -ItemType Directory -Path $stage | Out-Null
            Copy-Item 'install.ps1', 'dist/qnote.cer', "dist/QNote_${{ steps.version.outputs.version }}_x64.msix" $stage/
            Compress-Archive -Path "$stage/*" -DestinationPath "dist/QNote_${{ steps.version.outputs.version }}_x64_Installer.zip"
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      # ── Verify ────────────────────────────────────────────────────────────

      - name: Verify signature (SignPath)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "dist/QNote_${{ steps.version.outputs.version }}_x64.msix"
          if ($sig.Status -ne 'Valid') { throw "Signature invalid: $($sig.Status)" }
          Write-Output "Signed by: $($sig.SignerCertificate.Subject)"

      # Self-signed certs are not trusted on the runner, so Status will not be
      # Valid — assert the signer subject instead.
      - name: Verify signature (self-signed)
        if: vars.SIGNPATH_ORGANIZATION_ID == ''
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "dist/QNote_${{ steps.version.outputs.version }}_x64.msix"
          if ($sig.SignerCertificate.Subject -ne 'CN=QNote') {
            throw "Unexpected signer: $($sig.SignerCertificate.Subject)"
          }
          Write-Output "Signed by: $($sig.SignerCertificate.Subject) (status: $($sig.Status))"

      # ── Checksums + Release ───────────────────────────────────────────────

      - name: SHA256 checksums
        shell: pwsh
        run: |
          # Checksum the primary downloadable: the Installer.zip in self-signed
          # mode, the bare signed MSIX in SignPath mode.
          $zip  = "dist/QNote_${{ steps.version.outputs.version }}_x64_Installer.zip"
          $msix = "dist/QNote_${{ steps.version.outputs.version }}_x64.msix"
          $main = if (Test-Path $zip) { $zip } else { $msix }
          $hash = (Get-FileHash $main -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $main -Leaf)" | Out-File 'dist/SHA256SUMS.txt' -Encoding utf8
          Get-Content 'dist/SHA256SUMS.txt'

      # On tag pushes the tag already exists; on workflow_dispatch gh creates
      # it from the triggering commit. Release notes are auto-generated and can
      # be edited afterwards on GitHub.
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$version" }
          # Self-signed mode ships ONLY the all-in-one Installer.zip (+ sums) —
          # bare msix/cer/ps1 stay inside the zip to keep the asset list clean.
          # SignPath mode ships the bare signed MSIX (+ sums).
          $assets = @('dist/SHA256SUMS.txt')
          $zip = "dist/QNote_${version}_x64_Installer.zip"
          if (Test-Path $zip) { $assets += $zip } else { $assets += "dist/QNote_${version}_x64.msix" }
          gh release create $tag --target $env:GITHUB_SHA --title "QNote $version" --generate-notes @assets
